services:
  - type: web
    name: campmatch
    runtime: python
    buildCommand: |
      cd frontend && npm install && npm run build
      cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        value: sqlite:////var/data/campmatch.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: PUBLIC_BASE_URL
        sync: false
      # Administrator portal (/admin). Set these in Render, never in the repo.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Google sign-in. Only approved school domains are accepted.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      # Moolre payments (can also be entered in the admin console at runtime).
      - key: MOOLRE_ENV
        value: live
      - key: MOOLRE_USER
        sync: false
      - key: MOOLRE_PUBKEY
        sync: false
      - key: MOOLRE_ACCOUNT_NUMBER
        sync: false
      - key: MOOLRE_WALLET_SECRET
        sync: false
      - key: MOOLRE_MERCHANT_EMAIL
        sync: false
      - key: MOOLRE_CALLBACK_URL
        sync: false
      # Web push (VAPID). Optional — keys are auto-generated and persisted on the
      # disk if these are left empty. Set VAPID_SUBJECT to a mailto: or https: URL.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
