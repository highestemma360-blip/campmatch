services:
  - type: web
    name: campmatch
    runtime: python
    buildCommand: |
      cd frontend && npm install && npm run build
      cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:////var/data/campmatch.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
